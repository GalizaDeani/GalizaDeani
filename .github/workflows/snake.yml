name: generate profile animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: GalizaDeani
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.svg

      - name: merge and push snake svg to output branch
        run: |
          git clone --depth 1 --branch output https://github.com/${{ github.repository }}.git /tmp/output-branch
          cp dist/*.svg /tmp/output-branch/
          cd /tmp/output-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -m "Update snake animation" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin output

  pacman:
    needs: snake
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: GalizaDeani

      - name: merge and push pacman svg to output branch
        run: |
          git clone --depth 1 --branch output https://github.com/${{ github.repository }}.git /tmp/output-branch
          cp dist/*.svg /tmp/output-branch/
          cd /tmp/output-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git commit -m "Update pacman animation" || echo "No changes to commit"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin output
